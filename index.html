<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f2"><title>Call Me | Couvertures</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#242722;background:#faf7f2}*{box-sizing:border-box}body{margin:0;padding:24px 16px 55px}.wrap{max-width:560px;margin:auto}h1{font-size:25px;margin:0 0 5px}header p{margin:0 0 22px;color:#6e746b;font-size:13px}.card{background:white;border:1px solid #e7e6e0;border-radius:18px;padding:17px;margin-bottom:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.temp{font-size:29px;font-weight:750;margin:8px 0}label{font-size:14px;font-weight:650}input[type=range]{width:100%;accent-color:#d4a72c}select{width:100%;padding:11px 8px;border-radius:10px;border:1px solid #ddd;background:white;font-size:14px}.toggle{display:flex;background:#f8efd7;border-radius:12px;padding:4px;gap:4px}.toggle button{flex:1;border:0;background:transparent;padding:11px 5px;border-radius:9px;font-size:13px;color:#6b541e}.toggle button.active{background:#e6b83d;color:#342500;box-shadow:0 1px 5px #0002;font-weight:700}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#fff3d0;border-radius:13px;padding:15px}.result small{color:#8c681b}.result strong{display:block;font-size:29px;margin-top:6px}.line{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee;font-size:14px}.line:last-child{border-bottom:0}.line b{text-align:right}.warning{font-size:13px;color:#955421;margin-top:12px}.copy{width:100%;padding:14px;background:#d4a72c;border:0;border-radius:12px;color:white;font-size:15px;font-weight:650;margin-top:5px}.foot{color:#757b73;font-size:12px;line-height:1.5;margin-top:15px}@media(max-width:370px){.cols{gap:7px}.card{padding:12px}.temp{font-size:25px}}</style></head><body><main class="wrap"><header><h1>🐴 Couvertures Call Me</h1><p>Pré avec abri · Toulouse · Une seule couche retirée le matin</p></header><section class="cols"><div class="card"><label for="day">☀️ Jour</label><div class="temp" id="dayLabel">11 °C</div><input id="day" type="range" min="-5" max="22" value="11"><select id="dayWeather"><option value="dry">Sec</option><option value="rain">Pluie</option><option value="wind">Vent</option><option value="rainwind">Pluie + vent</option></select></div><div class="card"><label for="night">🌙 Nuit</label><div class="temp" id="nightLabel">3 °C</div><input id="night" type="range" min="-5" max="22" value="3"><select id="nightWeather"><option value="dry">Sec</option><option value="rain">Pluie</option><option value="wind">Vent</option><option value="rainwind">Pluie + vent</option></select></div></section><section class="card"><div class="toggle"><button id="unclipped" type="button">Non tondue</button><button id="clipped" type="button" class="active">Tonte intégrale</button></div></section><section class="card"><div class="results"><div class="result"><small>☀️ Jour</small><strong id="dayResult">0 g</strong></div><div class="result"><small>🌙 Nuit</small><strong id="nightResult">200 g</strong></div></div><div class="line"><span>Le soir</span><b id="evening">0 g + 200 g</b></div><div class="line"><span>À retirer le matin</span><b id="morning">200 g</b></div><div class="line"><span>Couvre-cou</span><b id="neck">Non</b></div><p class="warning" id="warning" hidden></p></section></main><script>function $(id){return document.getElementById(id)}
let clipped=true;
// Modèle de gestion empirique, PAS une température ressentie scientifique équine.
// Les ajustements météo sont volontairement modestes car les couvertures sont imperméables et le pré dispose d'un abri.
const offsets={dry:0,rain:1,wind:1,rainwind:3};
function needs(t,w,c){
 const effective=t-offsets[w];
 if(c){
   if(effective>=16)return {g:null,e:effective};
   if(effective>=10)return {g:0,e:effective};
   if(effective>=5)return {g:100,e:effective};
   if(effective>=0)return {g:200,e:effective};
   return {g:300,e:effective};
 }
 if(effective>=17)return {g:null,e:effective};
 if(effective>=5)return {g:0,e:effective};
 if(effective>=0)return {g:100,e:effective};
 return {g:200,e:effective};
}
// Une seule couche peut être retirée le matin, toujours la plus chaude.
// 0 g = vraie couverture imperméable ; null = aucune couverture.
const combos=[
 {base:null,top:null},{base:0,top:null},{base:100,top:null},{base:200,top:null},
 {base:null,top:0},{base:null,top:100},{base:null,top:200},
 {base:0,top:100},{base:0,top:200},{base:100,top:200}
];
const name=g=>g===null?'Sans couverture':g+' g';
const total=x=>x.base===null&&x.top===null?null:(x.base||0)+(x.top||0);
function distance(actual,needed){
 if(actual===needed)return 0;
 if(needed===null)return actual===0?24:90+(actual||0)*1.3;
 if(actual===null)return 75+needed*1.5;
 const diff=actual-needed;
 return diff<0?Math.abs(diff)*2.4:diff*1.8;
}
function update(){
 const day=+$('day').value,night=+$('night').value,dw=$('dayWeather').value,nw=$('nightWeather').value;
 $('dayLabel').textContent=day+' °C';$('nightLabel').textContent=night+' °C';
 $('clipped').classList.toggle('active',clipped);$('unclipped').classList.toggle('active',!clipped);
 const dt=needs(day,dw,clipped),nt=needs(night,nw,clipped);
 const score=x=>{
   let cost=distance(x.base,dt.g)*1.25+distance(total(x),nt.g);
   // Préférer la solution la plus simple quand les protections sont équivalentes.
   if(x.top!==null)cost+=3;
   // Ne pas retirer l'imperméabilité par météo défavorable si on peut l'éviter.
   if(x.base===null&&dw!=='dry')cost+=100;
   if(total(x)===null&&nw!=='dry')cost+=100;
   return cost;
 };
 const best=[...combos].sort((a,b)=>score(a)-score(b))[0];
 const nightTotal=total(best);
 const neckNight=clipped&&(night<=0||(night<=5&&nw==='rainwind'));
 const neckDay=clipped&&day<=2&&dw==='rainwind';
 $('dayResult').textContent=name(best.base);
 $('nightResult').textContent=name(nightTotal);
 $('evening').textContent=best.top!==null?(best.base===null?name(best.top):name(best.base)+' + '+name(best.top)):name(best.base);
 $('morning').textContent=best.top!==null?name(best.top):'Rien';
 $('neck').textContent=neckNight?(neckDay?'Oui, jour et nuit':'Oui, la nuit uniquement'):'Non';
 const warnings=[];
 if(day<night)warnings.push('Vérifie les températures jour/nuit.');
 if(neckNight&&!neckDay)warnings.push('Retirer le couvre-cou le matin.');
 if(best.base!==dt.g||nightTotal!==nt.g)warnings.push('Compromis de couches : contrôler son confort.');
 $('warning').hidden=!warnings.length;$('warning').textContent=warnings.join(' ');
}
['day','night','dayWeather','nightWeather'].forEach(id=>$(id).addEventListener('input',update));
$('clipped').onclick=()=>{clipped=true;update()};$('unclipped').onclick=()=>{clipped=false;update()};update();</script></body></html>
